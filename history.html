
<!DOCTYPE html>
<html>

<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/tables.css">

<body>

<div class="header">

<div class="logo-area">
<img src="icon-1922.png">

<div>
<h2>KANIFNATH CONSTRUCTION</h2>
<div class="subtitle">Activity History & Revenue Overview</div>
</div>

</div>

</div>

<nav class="page-nav no-print">
    <div class="page-nav-left">
        <a class="page-nav-btn" href="javascript:void(0)" onclick="if(document.referrer && document.referrer.indexOf(location.host)!==-1){history.back()}else{location.href='index.html'}">
            <i class="fa-solid fa-arrow-left"></i> <span class="btn-label">Back</span>
        </a>
        <a class="page-nav-btn dashboard" href="index.html">
            <i class="fa-solid fa-gauge"></i> <span class="btn-label">Dashboard</span>
        </a>
    </div>
    <div class="breadcrumb">
        <a href="index.html">Dashboard</a> <i class="fa-solid fa-chevron-right"></i> <span class="crumb-current">History</span>
    </div>
</nav>

<div class="container">

<div class="top-bar">

<div class="search-box">
<input type="text" id="searchInput" placeholder="Search number, client or labour..." oninput="loadHistory()">
</div>

<div class="filters-row">

<div class="filter">
<label>Type</label>
<select id="typeFilter" onchange="loadHistory()">
<option value="All">All</option>
<option value="Invoice">Invoice</option>
<option value="Quotation">Quotation</option>
<option value="Labour Expense">Labour Expense</option>
<option value="Labour Payment">Labour Payment</option>
</select>
</div>

<div class="filter">
<label>Project / Site</label>
<select id="projectFilter" onchange="loadHistory()">
<option value="All">All</option>
</select>
</div>

<div class="filter">
<label>From</label>
<input type="date" id="fromDate" onchange="loadHistory()">
</div>

<div class="filter">
<label>To</label>
<input type="date" id="toDate" onchange="loadHistory()">
</div>

<div class="filter">
<label>&nbsp;</label>
<button class="action-btn secondary" onclick="clearFilters()">Clear</button>
</div>

</div>

</div>

<div class="stats-row">
<div class="stat-card"><span class="label">Total Revenue (Invoices)</span>₹ <span id="totalRevenue">0.00</span></div>
<div class="stat-card"><span class="label">Total Labour Outflow</span>₹ <span id="totalLabourOut">0.00</span></div>
<div class="stat-card"><span class="label">Records Shown</span><span id="recordCount">0</span></div>
</div>

<div class="table-wrapper">

<table>

<thead>
<tr>
<th>Type</th>
<th>Ref No.</th>
<th>Date</th>
<th>Client / Labour</th>
<th>Project / Site</th>
<th>Amount</th>
<th>Action</th>
</tr>
</thead>

<tbody id="historyTable"></tbody>

</table>

</div>

</div>

<div class="modal-overlay" id="detailsModal">
  <div class="modal-box">
    <h3 id="modalTitle">Details</h3>
    <div id="modalBody"></div>
    <button class="modal-close" onclick="closeDetails()">Close</button>
  </div>
</div>

<div class="footer">
© <span id="year"></span> <strong>Kanifnath Construction</strong>
</div>

<script type="module">
import { db, collection, onSnapshot, deleteDoc as firestoreDeleteDoc, doc } from "./firebase.js";

let rawDocuments = [];
let rawLabours = [];
let rawLabourExpenses = [];
let rawLabourPayments = [];

function labourName(labourId){
  const l = rawLabours.find(x => x.id === labourId);
  return l ? l.name : 'Unknown Labour';
}

function labourSite(labourId){
  const l = rawLabours.find(x => x.id === labourId);
  return l ? (l.site || '') : '';
}

// Builds one unified, normalized activity list from every relevant collection.
// Kept intentionally explicit (not a blind merge) so each record type maps to
// known, meaningful fields instead of guessing shared keys across collections.
function buildUnifiedHistory(){
  const out = [];

  rawDocuments.forEach(d => {
    out.push({
      id: d.id,
      sourceCollection: 'documents',
      type: d.type || 'Document',
      number: d.number || '-',
      date: d.date || '',
      person: d.client || 'Unknown',
      project: d.site || '',
      amount: parseFloat(d.amount) || 0,
      raw: d
    });
  });

  rawLabourExpenses.forEach(e => {
    out.push({
      id: e.id,
      sourceCollection: 'labourExpenses',
      type: 'Labour Expense',
      number: e.id || '-',
      date: e.date || '',
      person: labourName(e.labourId),
      project: labourSite(e.labourId),
      amount: parseFloat(e.amount) || 0,
      raw: e
    });
  });

  rawLabourPayments.forEach(p => {
    out.push({
      id: p.id,
      sourceCollection: 'labourPayments',
      type: 'Labour Payment',
      number: p.id || '-',
      date: p.date || '',
      person: labourName(p.labourId),
      project: labourSite(p.labourId),
      amount: parseFloat(p.amount) || 0,
      raw: p
    });
  });

  // Newest first when dates are comparable; falls back gracefully otherwise.
  out.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  return out;
}

window.__historyData = [];

function refreshAndRender(){
  window.__historyData = buildUnifiedHistory();
  populateProjectFilter();
  window.loadHistory();
}

onSnapshot(collection(db, "documents"), (snap) => {
  rawDocuments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  refreshAndRender();
});

onSnapshot(collection(db, "labours"), (snap) => {
  rawLabours = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  refreshAndRender();
});

onSnapshot(collection(db, "labourExpenses"), (snap) => {
  rawLabourExpenses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  refreshAndRender();
});

onSnapshot(collection(db, "labourPayments"), (snap) => {
  rawLabourPayments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  refreshAndRender();
});

function populateProjectFilter(){
  const select = document.getElementById("projectFilter");
  const current = select.value;
  const projects = Array.from(new Set(window.__historyData.map(r => r.project).filter(Boolean))).sort();
  select.innerHTML = '<option value="All">All</option>' + projects.map(p => `<option value="${p}">${p}</option>`).join('');
  if (projects.includes(current)) select.value = current;
}

window.deleteHistoryDoc = async function (docId) {
  if (!confirm("Delete this document? This cannot be undone.")) return;
  await firestoreDeleteDoc(doc(db, "documents", docId));
  // Table refreshes automatically via the onSnapshot listener above.
};
</script>

<script>

document.getElementById("year").innerText=new Date().getFullYear();

function clearFilters(){
  document.getElementById("searchInput").value = "";
  document.getElementById("typeFilter").value = "All";
  document.getElementById("projectFilter").value = "All";
  document.getElementById("fromDate").value = "";
  document.getElementById("toDate").value = "";
  loadHistory();
}

function typeBadgeClass(type){
  switch(type){
    case 'Invoice': return 'type-invoice';
    case 'Quotation': return 'type-quotation';
    case 'Labour Expense': return 'type-labourexpense';
    case 'Labour Payment': return 'type-labourpayment';
    default: return '';
  }
}

function loadHistory(){

let data = window.__historyData || [];

let table = document.getElementById("historyTable");

let search = String(document.getElementById("searchInput").value || "").toLowerCase();
let filter = document.getElementById("typeFilter").value;
let projectFilter = document.getElementById("projectFilter").value;
let fromDate = document.getElementById("fromDate").value;
let toDate = document.getElementById("toDate").value;

table.innerHTML = "";

let totalRevenue = 0;
let totalLabourOut = 0;
let count = 0;

data.forEach((item) => {

  let number = String(item.number || "").toLowerCase();
  let person = String(item.person || "").toLowerCase();
  let project = String(item.project || "").toLowerCase();

  let matchSearch = !search || number.includes(search) || person.includes(search) || project.includes(search);
  let matchType = filter === "All" || item.type === filter;
  let matchProject = projectFilter === "All" || item.project === projectFilter;
  let matchFrom = !fromDate || (item.date && item.date >= fromDate);
  let matchTo = !toDate || (item.date && item.date <= toDate);

  if (matchSearch && matchType && matchProject && matchFrom && matchTo) {

    let row = table.insertRow();

    let actionHtml = `<button class="action-btn" onclick='viewHistoryDetails(${JSON.stringify(JSON.stringify(item)).replace(/'/g, "&#39;")})'>View</button>`;
    if (item.sourceCollection === 'documents') {
      actionHtml += `<button class="action-btn danger" onclick="deleteHistoryDoc('${item.id}')">Delete</button>`;
    } else {
      actionHtml += `<button class="action-btn secondary" onclick="location.href='labour-management.html'">Manage</button>`;
    }

    row.innerHTML = `
      <td><span class="type-badge ${typeBadgeClass(item.type)}">${item.type}</span></td>
      <td>${item.number || "-"}</td>
      <td>${item.date || "-"}</td>
      <td><span class="client" onclick="exportPerson('${item.person.replace(/'/g,"&#39;")}')">${item.person || "Unknown"}</span></td>
      <td>${item.project || "-"}</td>
      <td>₹ ${item.amount.toFixed(2)}</td>
      <td>${actionHtml}</td>
    `;

    if (item.type === "Invoice") totalRevenue += item.amount;
    if (item.type === "Labour Expense" || item.type === "Labour Payment") totalLabourOut += item.amount;

    count++;
  }

});

if (count === 0) {
  table.innerHTML = `<tr><td colspan="7" class="empty">No records match the current filters</td></tr>`;
}

document.getElementById("totalRevenue").innerText = totalRevenue.toFixed(2);
document.getElementById("totalLabourOut").innerText = totalLabourOut.toFixed(2);
document.getElementById("recordCount").innerText = count;

}

window.loadHistory = loadHistory;

function viewHistoryDetails(jsonStr){
  let item;
  try { item = JSON.parse(jsonStr); } catch(e) { return; }

  document.getElementById("modalTitle").innerText = `${item.type} — ${item.number}`;

  let rows = [
    ['Date', item.date || '-'],
    ['Client / Labour', item.person || '-'],
    ['Project / Site', item.project || '-'],
    ['Amount', '₹ ' + item.amount.toFixed(2)]
  ];

  if (item.raw && item.raw.status) rows.push(['Status', item.raw.status]);
  if (item.raw && item.raw.remark) rows.push(['Remark', item.raw.remark]);
  if (item.raw && item.raw.type && item.sourceCollection === 'labourExpenses') rows.push(['Expense Type', item.raw.type]);
  if (item.raw && item.raw.mode) rows.push(['Payment Mode', item.raw.mode]);

  let html = rows.map(r => `<div class="modal-row"><strong>${r[0]}</strong><span>${r[1]}</span></div>`).join('');

  if (item.raw && Array.isArray(item.raw.items) && item.raw.items.length > 0) {
    html += `<table class="items-mini-table"><thead><tr><th>Description</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody>`;
    item.raw.items.forEach(it => {
      html += `<tr><td>${(it.description || '-')}</td><td>${it.qty ?? '-'}</td><td>${it.rate ?? '-'}</td><td>${(it.amount ?? 0).toFixed ? it.amount.toFixed(2) : it.amount}</td></tr>`;
    });
    html += `</tbody></table>`;
  }

  document.getElementById("modalBody").innerHTML = html;
  document.getElementById("detailsModal").classList.add("active");
}

window.viewHistoryDetails = viewHistoryDetails;

function closeDetails(){
  document.getElementById("detailsModal").classList.remove("active");
}
window.closeDetails = closeDetails;

function exportPerson(person){

let data = window.__historyData || [];
let rows = [["Type","Number","Date","Client/Labour","Project/Site","Amount"]];

data.forEach(d => {
  if (d.person === person) {
    rows.push([d.type, d.number, d.date, d.person, d.project, d.amount]);
  }
});

let csv = rows.map(r => r.join(",")).join("\n");
let blob = new Blob([csv], {type:"text/csv"});
let a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = person + "_report.csv";
a.click();

}
window.exportPerson = exportPerson;

</script>

</body>
</html>
