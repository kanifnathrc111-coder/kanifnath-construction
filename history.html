
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>History - Kanifnath Construction</title>
<script type="module">
  import { auth, onAuthStateChanged } from "./firebase.js";
  onAuthStateChanged(auth, (user) => {
    if (!user) window.location.href = "login.html";
  });
</script>

<style>

body{
margin:0;
font-family:Segoe UI,Arial;
background:linear-gradient(135deg,#eef2f7,#ffffff);
}

/* HEADER */

.header{
background:linear-gradient(90deg,#7a0c0c,#a30000);
color:#fff;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 4px 15px rgba(0,0,0,0.15);
flex-wrap:wrap;
}

.logo-area{
display:flex;
align-items:center;
gap:12px;
}

.logo-area img{
width:45px;
}

.logo-area h2{
margin:0;
font-size:20px;
}

.subtitle{
font-size:12px;
opacity:0.85;
}

.header button{
background:#fff;
color:#7a0c0c;
border:none;
padding:6px 16px;
border-radius:20px;
cursor:pointer;
font-weight:600;
}

/* CONTAINER */

.container{
padding:40px;
max-width:1100px;
margin:auto;
}

/* TOP BAR */

.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
flex-wrap:wrap;
gap:15px;
}

.search-box input,
.filter select{
padding:8px 14px;
border:1px solid #ccc;
border-radius:20px;
}

.revenue-card{
background:#fff;
padding:15px 20px;
border-radius:12px;
box-shadow:0 6px 18px rgba(0,0,0,0.06);
font-weight:600;
color:#7a0c0c;
}

/* TABLE */

.table-wrapper{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
border-radius:12px;
overflow:hidden;
box-shadow:0 8px 25px rgba(0,0,0,0.05);
}

th{
background:#7a0c0c;
color:#fff;
padding:12px;
font-size:13px;
}

td{
padding:12px;
border-bottom:1px solid #eee;
text-align:center;
font-size:13px;
}

tr:hover{
background:#f9f9f9;
}

.client{
color:#7a0c0c;
font-weight:600;
cursor:pointer;
}

.action-btn{
background:#7a0c0c;
color:#fff;
border:none;
padding:6px 14px;
cursor:pointer;
border-radius:20px;
font-size:12px;
}

.empty{
text-align:center;
padding:25px;
color:#888;
font-style:italic;
}

/* FOOTER */

.footer{
margin-top:50px;
text-align:center;
padding:25px;
font-size:13px;
color:#666;
border-top:1px solid #ddd;
background:#fafafa;
}

.footer strong{
color:#7a0c0c;
}

</style>
</head>

<body>

<div class="header">

<div class="logo-area">
<img src="LOGOKF.jpg">

<div>
<h2>KANIFNATH CONSTRUCTION</h2>
<div class="subtitle">Document History & Revenue Overview</div>
</div>

</div>

<button onclick="location.href='index.html'">← Dashboard</button>

</div>

<div class="container">

<div class="top-bar">

<div class="search-box">
<input type="text" id="searchInput" placeholder="Search Number or Client..." oninput="loadHistory()">
</div>

<div class="filter">
<select id="typeFilter" onchange="loadHistory()">
<option value="All">All</option>
<option value="Invoice">Invoice</option>
<option value="Quotation">Quotation</option>
</select>
</div>

<div class="revenue-card">
Total Revenue: ₹ <span id="totalRevenue">0.00</span>
</div>

</div>

<div class="table-wrapper">

<table>

<thead>
<tr>
<th>Type</th>
<th>Number</th>
<th>Date</th>
<th>Client</th>
<th>Amount</th>
<th>Action</th>
</tr>
</thead>

<tbody id="historyTable"></tbody>

</table>

</div>

</div>

<div class="footer">
© <span id="year"></span> <strong>Kanifnath Construction</strong>
</div>

<script type="module">
import { db, collection, onSnapshot, deleteDoc as firestoreDeleteDoc, doc } from "./firebase.js";

window.__historyData = [];

onSnapshot(collection(db, "documents"), (snap) => {
  window.__historyData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  window.loadHistory();
});

window.deleteHistoryDoc = async function (docId) {
  if (!confirm("Delete this document?")) return;
  await firestoreDeleteDoc(doc(db, "documents", docId));
  // loadHistory() runs again automatically via the onSnapshot listener above
};
</script>

<script>

document.getElementById("year").innerText=new Date().getFullYear()

function loadHistory(){

let data = window.__historyData || []

let table = document.getElementById("historyTable")

let search = document.getElementById("searchInput").value.toLowerCase()

let filter = document.getElementById("typeFilter").value

table.innerHTML=""

let totalRevenue=0

let count=0

data.forEach((doc)=>{

let number = doc.number ? doc.number.toLowerCase() : ""

let client = doc.client ? doc.client.toLowerCase() : ""

let matchSearch =
number.includes(search) || client.includes(search)

let matchType =
filter==="All" || doc.type===filter

if(matchSearch && matchType){

let amount = parseFloat(doc.amount) || 0

let row = table.insertRow()

row.innerHTML=`

<td>${doc.type || "-"}</td>

<td>${doc.number || "-"}</td>

<td>${doc.date || "-"}</td>

<td>
<span class="client"
onclick="exportClient('${doc.client || ""}')">
${doc.client || "Unknown"}
</span>
</td>

<td>₹ ${amount.toFixed(2)}</td>

<td>
<button class="action-btn"
onclick="deleteHistoryDoc('${doc.id}')">
Delete
</button>
</td>

`

if(doc.type==="Invoice"){
totalRevenue += amount
}

count++

}

})

if(count===0){

table.innerHTML=
`<tr><td colspan="6" class="empty">
No documents found
</td></tr>`

}

document.getElementById("totalRevenue").innerText=
totalRevenue.toFixed(2)

}

window.loadHistory = loadHistory

function exportClient(client){

let data = window.__historyData || []

let rows=[["Type","Number","Date","Client","Amount"]]

data.forEach(d=>{

if(d.client===client){

rows.push([
d.type,
d.number,
d.date,
d.client,
d.amount
])

}

})

let csv=
rows.map(r=>r.join(",")).join("\n")

let blob=
new Blob([csv],{type:"text/csv"})

let a=document.createElement("a")

a.href=URL.createObjectURL(blob)

a.download=client+"_report.csv"

a.click()

}

loadHistory()

</script>

</body>
</html>
