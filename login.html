<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in - Kanifnath Construction ERP</title>
<meta name="theme-color" content="#850D0D">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-1922.png">
<link rel="apple-touch-icon" href="icon-1922.png">
<link rel="stylesheet" href=".app.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-brand-dark via-brand to-[#3a0505] flex flex-col items-center justify-center p-4">

<main class="w-full max-w-sm animate-fade-up">

  <!-- Firebase email / password sign-in (the only gate; data is protected by Firestore Rules) -->
  <section id="authCard" class="card p-6 sm:p-8 shadow-lift" aria-labelledby="authTitle">
    <div class="text-center mb-6">
      <img data-logo src="icon-1922.png" alt="Kanifnath Construction logo" class="w-16 h-16 mx-auto rounded-2xl border border-line object-cover bg-white">
      <h1 id="authTitle" class="mt-4 text-lg font-extrabold tracking-wide text-brand">KANIFNATH CONSTRUCTION</h1>
      <p class="text-xs font-semibold text-muted tracking-widest">ERP CONTROL PANEL</p>
      <p id="authSubtitle" class="mt-3 text-sm text-muted">Sign in to continue</p>
    </div>
    <form id="authForm" novalidate class="space-y-4">
      <div id="authError" role="alert" class="hidden rounded-xl border border-red-300 bg-red-50 text-red-700 text-sm px-3 py-2"></div>
      <div><label class="label" for="authEmail">Email</label>
        <input id="authEmail" type="email" class="input" autocomplete="username" inputmode="email" placeholder="you@example.com"></div>
      <div><label class="label" for="authPassword">Password</label>
        <input id="authPassword" type="password" class="input" autocomplete="current-password" placeholder="Password"></div>
      <button id="authSubmitBtn" type="submit" class="btn btn-primary w-full">Sign In</button>
    </form>
    <button id="authSwitchLink" type="button" class="mt-4 w-full text-center text-sm font-semibold text-brand hover:underline min-h-[44px]">New here? Create an account</button>
  </section>

  <div class="mt-5 flex items-center justify-center gap-4 text-xs text-white/80">
    <span>&copy; <span id="year"></span> Kanifnath Construction</span>
    <button id="voiceBtn" type="button" class="inline-flex items-center gap-1 rounded-lg px-2 min-h-[44px] hover:bg-white/10" aria-pressed="true" aria-label="Toggle voice prompts"></button>
  </div>
</main>

<script type="module">
import { auth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "./firebase.js";
import { icon, hydrateIcons, fixLogos } from "./common.js";

const $ = (id) => document.getElementById(id);
$("year").textContent = new Date().getFullYear();

/* ---------- Email / password ---------- */
/* Self-service sign-up is OFF by default: create users in Firebase Console > Authentication > Users.
 * Set to true only if you deliberately want a public "Create an account" option (then also review your Firestore Rules). */
const ALLOW_SIGNUP = false;
let authMode = "signin";
if (!ALLOW_SIGNUP) $("authSwitchLink").classList.add("hidden");
function friendly(err) {
  const c = (err && err.code) || "";
  if (/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)) return "Invalid email or password.";
  if (/too-many-requests/.test(c)) return "Too many attempts. Please wait a few minutes and try again.";
  if (/network/.test(c)) return "Network problem - check your connection.";
  if (/email-already-in-use/.test(c)) return "An account with this email already exists.";
  if (/weak-password/.test(c)) return "Password should be at least 6 characters.";
  if (/operation-not-allowed/.test(c)) return "Account creation is disabled for this project.";
  return (err && err.message) || "Authentication failed.";
}
function showError(msg) { const e = $("authError"); e.textContent = msg; e.classList.toggle("hidden", !msg); }
$("authSwitchLink").addEventListener("click", () => {
  authMode = authMode === "signin" ? "signup" : "signin"; showError("");
  const up = authMode === "signup";
  $("authSubtitle").textContent = up ? "Create your account" : "Sign in to continue";
  $("authSubmitBtn").textContent = up ? "Create Account" : "Sign In";
  $("authSwitchLink").textContent = up ? "Already have an account? Sign in" : "New here? Create an account";
  $("authPassword").autocomplete = up ? "new-password" : "current-password";
});
$("authForm").addEventListener("submit", async (e) => {
  e.preventDefault(); showError("");
  const email = $("authEmail").value.trim(), password = $("authPassword").value;
  if (!email || !password) { showError("Please enter email and password."); return; }
  if (authMode === "signup" && !ALLOW_SIGNUP) return;
  if (!/^\S+@\S+\.\S+$/.test(email)) { showError("Please enter a valid email address."); return; }
  const btn = $("authSubmitBtn"), label = btn.textContent;
  btn.disabled = true; btn.textContent = "Please wait...";
  try {
    if (authMode === "signup") await createUserWithEmailAndPassword(auth, email, password);
    else { justSignedIn = true; await signInWithEmailAndPassword(auth, email, password); }
  } catch (err) { justSignedIn = false; showError(friendly(err)); btn.disabled = false; btn.textContent = label; }
});
let redirecting = false;
function goIn(speakIt) {
  if (redirecting) return; redirecting = true;
  if (speakIt) speak("Welcome to Kanifnath Construction.");
  setTimeout(() => { location.replace("index.html"); }, speakIt && voiceOn ? 900 : 0);
}
let justSignedIn = false;
onAuthStateChanged(auth, (user) => { if (user) goIn(justSignedIn); });

/* ---------- Voice prompts (existing feature, now with an off switch) ---------- */
let voiceOn = true;
try { voiceOn = localStorage.getItem("kcVoice") !== "off"; } catch (e) {}
function paintVoice() {
  const b = $("voiceBtn"); b.setAttribute("aria-pressed", String(voiceOn));
  b.innerHTML = icon(voiceOn ? "volume" : "mute", "w-4 h-4") + "<span>Voice " + (voiceOn ? "on" : "off") + "</span>";
}
$("voiceBtn").addEventListener("click", () => { voiceOn = !voiceOn; try { localStorage.setItem("kcVoice", voiceOn ? "on" : "off"); } catch (e) {} if (!voiceOn && window.speechSynthesis) speechSynthesis.cancel(); paintVoice(); });
paintVoice();
function speak(text) {
  if (!voiceOn || !("speechSynthesis" in window)) return;
  const m = new SpeechSynthesisUtterance(text); m.rate = 0.9; m.pitch = 1.1; speechSynthesis.speak(m);
}
hydrateIcons(); fixLogos();
</script>
</body>
</html>
